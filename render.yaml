services:
  - type: web
    name: civicsolve-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: civicsolve-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: .
    envVars:
      - key: CIVICSOLVE_API
        fromService:
          name: civicsolve-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
